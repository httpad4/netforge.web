<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — NetForge</title>
  <script>(function(){try{var t=localStorage.getItem('nf-theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="admin">
  <a class="skip-link" href="#main">Skip to content</a>

  <main id="main" class="container" style="padding-block:1.5rem">
    <h1>Admin</h1>

    <div id="admin-denied" class="callout callout-danger" hidden>
      <span id="ad-icon"></span>
      <div>You need an administrator account to manage the curriculum.</div>
    </div>

    <div id="admin-shell" hidden>
      <div class="tabbar" role="tablist" aria-label="Admin sections">
        <button type="button" class="tab-btn active" role="tab" data-tab="modules" aria-selected="true">Modules</button>
        <button type="button" class="tab-btn" role="tab" data-tab="lessons" aria-selected="false">Lessons</button>
        <button type="button" class="tab-btn" role="tab" data-tab="quizzes" aria-selected="false">Quiz questions</button>
        <button type="button" class="tab-btn" role="tab" data-tab="analytics" aria-selected="false">Analytics</button>
      </div>

      <section id="tab-modules" aria-label="Modules administration"></section>
      <section id="tab-lessons" aria-label="Lessons administration" hidden></section>
      <section id="tab-quizzes" aria-label="Quiz administration" hidden></section>
      <section id="tab-analytics" aria-label="Analytics" hidden></section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>NetForge — self-paced networking course.</span>
      <a href="index.html">Home</a>
    </div>
  </footer>

  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
