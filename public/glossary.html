<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Glossary — NetForge</title>
  <script>(function(){try{var t=localStorage.getItem('nf-theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="glossary">
  <a class="skip-link" href="#main">Skip to content</a>

  <main id="main" class="container" style="padding-block:1.5rem">
    <h1>Glossary</h1>
    <p class="muted">Search or browse. Terms are linked automatically wherever they appear in lessons.</p>

    <label class="field" style="max-width:480px">
      <span class="field-label">Search terms</span>
      <div class="flex">
        <input id="glossary-search" type="search" placeholder="e.g. subnet, DNS, OSI…" aria-label="Filter glossary terms" />
        <button type="button" class="btn btn-cta-green" id="glossary-clear" aria-label="Clear search">Clear</button>
      </div>
    </label>

    <div id="glossary-count" class="hint mt-1" aria-live="polite"></div>
    <div class="grid grid-cards grid-cards-3 mt-2" id="glossary-list" aria-live="polite">
      <div class="empty-state">Loading terms…</div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>NetForge — self-paced networking course.</span>
      <a href="modules.html">Browse modules</a>
    </div>
  </footer>

  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/glossary.js"></script>
</body>
</html>
