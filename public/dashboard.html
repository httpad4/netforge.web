<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — NetForge</title>
  <script>(function(){try{var t=localStorage.getItem('nf-theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="dashboard">
  <a class="skip-link" href="#main">Skip to content</a>

  <main id="main" class="container" style="padding-block:1.5rem">
    <h1>Dashboard</h1>

    <div id="guest-state" class="callout callout-info" hidden>
      <span id="gs-icon"></span>
      <div>Sign in to track progress, keep a streak, and earn badges. <button type="button" class="btn btn-cta-green btn-sm" data-open-auth>Sign in / Create account</button></div>
    </div>

    <div id="dash-loading" class="empty-state">Loading your progress…</div>

    <section id="overall" class="card" hidden>
      <div class="flex-between" style="flex-wrap:wrap;gap:1rem">
        <div class="progress-hero" style="flex:1;min-width:220px">
          <span class="percent" id="percent"></span>
          <div>
            <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Overall course progress">
              <span id="percent-fill"></span>
            </div>
            <div class="meter-label"><span id="lessons-done"></span><span id="percent-txt"></span></div>
          </div>
        </div>
        <div class="stat-grid" style="flex:2;min-width:260px">
          <div class="stat"><span class="stat-icon" id="s1i"></span><div><div class="stat-value" id="s1v"></div><div class="stat-label">Lessons completed</div></div></div>
          <div class="stat"><span class="stat-icon" id="s2i"></span><div><div class="stat-value" id="s2v"></div><div class="stat-label">Modules complete</div></div></div>
          <div class="stat"><span class="stat-icon" id="s3i"></span><div><div class="stat-value" id="s3v"></div><div class="stat-label">Day streak</div></div></div>
          <div class="stat"><span class="stat-icon" id="s4i"></span><div><div class="stat-value" id="s4v"></div><div class="stat-label">Badges earned</div></div></div>
        </div>
      </div>
    </section>

    <section id="continue-row" class="grid grid-cards mt-2" style="grid-template-columns:1fr">
      <div class="card" id="continue-card" hidden>
        <h2 style="display:flex;gap:.5rem;align-items:center">Continue where you left off</h2>
        <div id="continue-body"></div>
      </div>
    </section>

    <section class="card mt-2">
      <h2 style="display:flex;gap:.5rem;align-items:center">Your badges</h2>
      <div class="badge-grid mt-1" id="badges-grid" aria-live="polite"></div>
    </section>

    <section class="card mt-2">
      <h2 style="display:flex;gap:.5rem;align-items:center">Modules</h2>
      <div class="grid grid-cards mt-1" id="module-progress-list" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>NetForge — self-paced networking course.</span>
      <a href="modules.html">Browse modules</a>
    </div>
  </footer>

  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
