<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Modules — NetForge</title>
  <script>(function(){try{var t=localStorage.getItem('nf-theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="modules">
  <a class="skip-link" href="#main">Skip to content</a>

  <main id="main" class="container" style="padding-block:1.5rem">
    <div class="flex-between">
      <div>
        <h1>Modules</h1>
        <p class="muted">Work through the course in order, or jump to a topic you need.</p>
      </div>
    </div>

    <div class="callout callout-info" id="guest-callout" hidden>
      <span id="guest-callout-icon"></span>
      <div>Sign in to track your progress, earn badges, and keep a streak. <button type="button" class="btn btn-cta-green btn-sm" data-open-auth>Sign in / Create account</button></div>
    </div>

    <div class="grid grid-cards mt-2" id="module-grid" aria-live="polite">
      <div class="empty-state">Loading modules…</div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>NetForge — self-paced networking course.</span>
      <span id="modules-arrow"><a href="index.html">Back to home</a></span>
    </div>
  </footer>

  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/modules.js"></script>
</body>
</html>
